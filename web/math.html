<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self' qrc:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src data:; connect-src 'none'; media-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
  >
  <meta name="referrer" content="no-referrer">
  <link rel="stylesheet" href="katex/katex.min.css">
  <style>
    :root {
      color-scheme: dark;
      font-family: Consolas, "Courier New", monospace;
      font-size: var(--inscreen-font-size, 18px);
    }

    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background: #000;
      color: #45ff1a;
    }

    body {
      scrollbar-color: #45ff1a #071607;
      scrollbar-width: thin;
    }

    #content {
      box-sizing: border-box;
      width: 100%;
      min-height: 1.45em;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      font-weight: 700;
      line-height: 1.42;
    }

    .katex {
      color: #fff;
      font-size: 1.08em;
    }

    .katex-display {
      box-sizing: border-box;
      max-width: 100%;
      margin: .45em 0;
      padding: .1em 0;
      overflow-x: auto;
      overflow-y: hidden;
      text-align: center;
    }

    ::selection {
      color: #fff;
      background: #176d0d;
    }

    ::-webkit-scrollbar { width: 11px; height: 8px; }
    ::-webkit-scrollbar-track { background: #071607; }
    ::-webkit-scrollbar-thumb { background: #45ff1a; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="content" aria-live="polite"></div>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="katex/katex.min.js"></script>
  <script src="katex/contrib/auto-render.min.js"></script>
  <script src="math-renderer.js"></script>
</body>
</html>
