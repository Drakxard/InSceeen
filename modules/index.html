<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Interactivo - WebView Nativo con Depuración</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Elementos de fondo -->
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>
  <div class="bg-blob blob-3"></div>

  <!-- OVERLAY DE ERROR A PANTALLA COMPLETA -->
  <div id="errorOverlay" class="error-overlay">
    <div class="error-card">
      <h2>🚨 Error de Ejecución</h2>
      <p style="margin-bottom: 10px; color: #94a3b8; font-size: 0.9rem;">Detalles técnicos del fallo para depuración:</p>
      <div id="errorDetailsText" class="error-details-box"></div>
      <button class="btn-close-error" onclick="closeErrorOverlay()">Cerrar y Continuar</button>
    </div>
  </div>

  <!-- Engranaje y panel de configuración -->
  <div class="settings-container">
    <button class="gear-btn" id="gearBtn" title="Configuración">
      <svg class="gear-icon" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
    </button>

    <div class="settings-panel" id="settingsPanel">
      <div class="field-group">
        <label for="dayInput">Día a solicitar</label>
        <input type="number" id="dayInput" class="input-compact" min="1" step="1" value="6">
      </div>
      <div class="field-group">
        <label for="promptInput">Instrucción Extra</label>
        <input type="text" id="promptInput" class="input-compact" placeholder="Ej: Hazlo fácil y corto...">
      </div>
      <div class="switch-container">
        <span class="switch-label" id="modeLabel">Página (paginasLeidas)</span>
        <label class="switch">
          <input type="checkbox" id="modeSwitch">
          <span class="slider"></span>
        </label>
      </div>
      <button class="btn-confirm" id="confirmBtn">Generar con Groq (APK)</button>
      <div id="statusMsg" class="status-msg"></div>
    </div>
  </div>

  <div class="wrapper">
    <!-- PANTALLA PRINCIPAL -->
    <div id="screen-main" class="screen active">
      <div class="container">
        <h1>Test</h1>
        <div class="options-grid">
          <button class="option-card option-choi" onclick="showScreen('screen-choi')">
            <div class="option-content">
              <span class="color-dot"></span><span>Choi</span>
            </div>
            <div class="icon-wrapper">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </div>
          </button>
          <button class="option-card option-preguntas" onclick="showScreen('screen-preguntas')">
            <div class="option-content">
              <span class="color-dot"></span><span>Preguntas</span>
            </div>
            <div class="icon-wrapper">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </div>
          </button>
        </div>
      </div>
    </div>

    <!-- PANTALLA CHOI -->
    <div id="screen-choi" class="screen">
      <div class="container">
        <h2 class="subtitle" id="choi-enunciado">Usa el panel para generar la trivia.</h2>
        <form class="quiz-options">
          <label class="radio-option">
            <input type="radio" name="pregunta" value="0">
            <span class="radio-custom"></span><span id="choi-op-0">Opción A</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="pregunta" value="1">
            <span class="radio-custom"></span><span id="choi-op-1">Opción B</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="pregunta" value="2">
            <span class="radio-custom"></span><span id="choi-op-2">Opción C</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="pregunta" value="3">
            <span class="radio-custom"></span><span id="choi-op-3">Ninguna de las anteriores</span>
          </label>
        </form>
      </div>
    </div>

    <!-- PANTALLA PREGUNTAS (FLASHCARD) -->
    <div id="screen-preguntas" class="screen">
      <div class="scene">
        <div id="flashcard" class="card-3d" onclick="this.classList.toggle('is-flipped')">
          <div class="card-face card-front">
            <p class="card-text" id="flashcard-pregunta">Abre la configuración para generar.</p>
          </div>
          <div class="card-face card-back">
            <p class="card-text" id="flashcard-respuesta">Aquí se mostrará la respuesta.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Botón Volver -->
  <div id="back-button-wrapper" class="btn-back-container">
    <button class="btn-back" onclick="showScreen('screen-main')">← Volver al Menú</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
