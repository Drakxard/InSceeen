<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inglés</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-blob blob-1"></div><div class="bg-blob blob-2"></div><div class="bg-blob blob-3"></div>
  <div id="errorOverlay" class="error-overlay" role="alertdialog" aria-modal="true">
    <div class="error-card"><h2>Error de ejecución</h2><p id="errorDetailsText" class="error-details-box"></p><button class="primary-btn" onclick="closeErrorOverlay()">Cerrar</button></div>
  </div>

  <main class="wrapper">
    <header class="deck-header"><span id="fileName">Cargando…</span><span id="cardCounter">0 / 0</span></header>
    <section id="cardStage" class="card-stage" aria-live="polite">
      <article id="flashcard" class="flashcard is-hidden" tabindex="0" role="button" aria-label="Tarjeta; tocá para ver la traducción">
        <div class="flashcard-face front"><span class="card-label">INGLÉS</span><p id="flashcard-english" class="card-text"></p><span class="tap-hint">Tocá para traducir</span></div>
        <div class="flashcard-face back"><span class="card-label">ESPAÑOL</span><p id="flashcard-spanish" class="card-text"></p><span class="tap-hint">Tocá para volver</span></div>
      </article>
      <article id="dayCard" class="day-card is-hidden">
        <span class="card-label">COMPLETADO</span>
        <h1>Día <span id="dayNumber">—</span></h1>
        <div class="day-actions"><button id="previousDay" class="day-btn">Anterior</button><button id="nextDay" class="day-btn primary-btn">Siguiente</button></div>
        <p id="dayNotice" class="day-notice" aria-live="polite"></p>
      </article>
      <div id="loadingCard" class="loading-card"><span class="loader"></span><p>Revisando tus tarjetas…</p></div>
    </section>
    <div id="deckControls" class="deck-controls is-hidden"><button id="previousCard" class="round-btn" aria-label="Tarjeta anterior">←</button><span>Deslizá para cambiar</span><button id="nextCard" class="round-btn" aria-label="Tarjeta siguiente">→</button></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
