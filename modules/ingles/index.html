<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inglés</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-blob blob-1"></div><div class="bg-blob blob-2"></div><div class="bg-blob blob-3"></div>
  <div id="errorOverlay" class="error-overlay" role="alertdialog" aria-modal="true">
    <div class="error-card"><h2>Error de ejecución</h2><p id="errorDetailsText" class="error-details-box"></p><button class="primary-btn" onclick="closeErrorOverlay()">Cerrar</button></div>
  </div>
  <div id="deleteOverlay" class="delete-overlay" role="dialog" aria-modal="true" aria-labelledby="deleteTitle" hidden>
    <div class="delete-dialog">
      <h2 id="deleteTitle">Borrar</h2>
      <p>¿Querés borrar esta línea del TXT?</p>
      <p id="deletePreview" class="delete-preview"></p>
      <div class="delete-actions">
        <button id="cancelDelete" class="day-btn" type="button">No</button>
        <button id="confirmDelete" class="day-btn delete-confirm" type="button">Sí</button>
      </div>
    </div>
  </div>

  <main class="wrapper">
    <section id="cardStage" class="card-stage" aria-live="polite">
      <article id="flashcard" class="flashcard is-hidden" tabindex="0" role="button" aria-label="Tarjeta; tocá para ver la traducción">
        <div class="flashcard-face front"><p id="flashcard-english" class="card-text"></p></div>
        <div class="flashcard-face back"><p id="flashcard-spanish" class="card-text"></p></div>
      </article>
      <article id="questionCard" class="question-card is-hidden" aria-live="polite">
        <p class="question-prompt" id="questionPromptText"></p>
        <div id="questionOptions" class="question-options"></div>
        <p id="questionStatus" class="question-status" aria-live="polite"></p>
        <button id="retryQuestions" class="question-retry is-hidden" type="button">Reintentar</button>
      </article>
      <article id="dayCard" class="day-card is-hidden">
        <span class="completion-label">COMPLETADO</span>
        <div class="completion-center"><p id="dayNotice" class="day-notice" aria-live="polite"></p><button id="retryDay" class="retry-btn" aria-label="Reintentar">↻</button></div>
        <div class="day-actions"><button id="previousDay" class="day-btn">Anterior</button><button id="nextDay" class="day-btn primary-btn">Siguiente</button></div>
      </article>
      <div id="loadingCard" class="loading-card"><span class="loader"></span><p id="loadingText">Revisando tus tarjetas…</p></div>
    </section>
  </main>
  <script type="text/plain" id="questionPrompt">Recibirás un arreglo JSON de entre uno y cuatro objetos con {"id":"identificador","linea":"inglés:español"}. Para cada objeto devolvé exactamente cuatro traducciones candidatas, distintas y en orden aleatorio. Una de las cuatro debe ser la traducción correcta, copiada exactamente desde la parte española de la línea. No uses "Ninguna de las anteriores" entre las candidatas. Respondé únicamente JSON válido con esta forma exacta: {"preguntas":[{"id":"mismo identificador","opciones":["traducción 1","traducción 2","traducción 3","traducción 4"],"correcta":0}]}. "correcta" debe indicar la posición de la traducción correcta con un entero entre 0 y 3. Devolvé exactamente un elemento por cada objeto recibido y no inventes identificadores.</script>
  <script src="app.js"></script>
</body>
</html>
