<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inglés</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-blob blob-1"></div><div class="bg-blob blob-2"></div><div class="bg-blob blob-3"></div>
  <div id="errorOverlay" class="error-overlay" role="alertdialog" aria-modal="true">
    <div class="error-card"><h2>Error de ejecución</h2><p id="errorDetailsText" class="error-details-box"></p><button class="primary-btn" onclick="closeErrorOverlay()">Cerrar</button></div>
  </div>

  <main class="wrapper">
    <section id="cardStage" class="card-stage" aria-live="polite">
      <article id="flashcard" class="flashcard is-hidden" tabindex="0" role="button" aria-label="Tarjeta; tocá para ver la traducción">
        <div class="flashcard-face front"><p id="flashcard-english" class="card-text"></p></div>
        <div class="flashcard-face back"><p id="flashcard-spanish" class="card-text"></p></div>
      </article>
      <article id="dayCard" class="day-card is-hidden">
        <div class="day-actions"><button id="previousDay" class="day-btn">Anterior</button><button id="retryDay" class="retry-btn" aria-label="Reintentar">↻</button><button id="nextDay" class="day-btn primary-btn">Siguiente</button></div>
        <p id="dayNotice" class="day-notice" aria-live="polite"></p>
      </article>
      <div id="loadingCard" class="loading-card"><span class="loader"></span><p>Revisando tus tarjetas…</p></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
