<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Síntesis</title>
  <link rel="stylesheet" href="/app-assets/katex/katex.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body aria-label="Módulo Síntesis">
  <main id="treeView" class="view"><header id="treeHeader" class="tree-header" hidden></header><button id="outlineButton" class="tree-import" type="button" aria-label="Importar temas y subtemas desde JSON">↓</button><section id="board" aria-label="Elementos de Síntesis"></section><p id="emptyHint">Mantén presionado el fondo para agregar un elemento.</p></main>
  <main id="sheetView" class="view sheet-view" hidden><header class="sheet-toolbar"><div id="sheetBack"></div><div class="sheet-actions"><button id="clipboardButton" class="arrow-button" type="button" aria-label="Pegar contenido; mantener para copiar la ruta">↓</button><button id="menuButton" class="menu-button" type="button" aria-label="Opciones del elemento">⋮</button></div></header><article id="sheetContent" class="sheet-content"></article><p id="sheetEmpty" class="sheet-empty">Toca ↓ para pegar una explicación desde el portapapeles.</p></main>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <div id="menuOverlay" class="overlay" hidden><section class="dialog action-dialog" role="dialog" aria-modal="true" aria-labelledby="menuTitle"><h2 id="menuTitle">Elemento</h2><button id="renameAction" type="button">Renombrar</button><button id="deleteAction" class="danger" type="button">Eliminar rama</button><button id="closeMenu" type="button">Cancelar</button></section></div>
  <div id="renameOverlay" class="overlay" hidden><form id="renameForm" class="dialog" role="dialog" aria-modal="true" aria-labelledby="renameTitle"><h2 id="renameTitle">Renombrar elemento</h2><input id="renameInput" maxlength="80" autocomplete="off" required><div class="dialog-actions"><button id="cancelRename" type="button">Cancelar</button><button type="submit">Guardar</button></div></form></div>
  <div id="deleteOverlay" class="overlay" hidden><section class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="deleteTitle"><h2 id="deleteTitle">Eliminar rama</h2><p id="deleteSummary"></p><div class="dialog-actions"><button id="cancelDelete" type="button">Cancelar</button><button id="confirmDelete" class="danger" type="button">Eliminar</button></div></section></div>
  <div id="pasteOverlay" class="overlay" hidden><section class="dialog action-dialog" role="dialog" aria-modal="true" aria-labelledby="pasteTitle"><h2 id="pasteTitle">Cargar explicación</h2><p>¿Qué hacemos con el contenido actual de esta hoja?</p><button id="replacePaste" class="danger" type="button">Reemplazar todo</button><button id="appendPaste" type="button">Poner debajo</button><button id="cancelPaste" type="button">Cancelar</button></section></div>
  <script src="/app-assets/katex/katex.min.js"></script><script src="/app-assets/katex/contrib/auto-render.min.js"></script><script src="core.js"></script><script src="markdown.js"></script><script src="app.js"></script>
</body>
</html>
