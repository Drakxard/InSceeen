<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
  <title>Anotaciones</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <button id="modeToggle" class="icon-button mode-toggle" type="button" aria-label="Cambiar a escritura manual" aria-pressed="false">
    <img id="modeIcon" src="mode-microphone.png" alt="">
  </button>
  <main>
    <header>
      <span>Anotaciones</span>
      <span id="position"></span>
    </header>
    <section id="stage">
      <article id="card" tabindex="0">
        <div id="front" class="face">
          <small>CABECERA</small>
          <h1 id="headerText"></h1>
          <textarea id="headerEditor" class="card-editor" maxlength="50000" aria-label="Cabecera de la tarjeta"></textarea>
          <p id="frontHint"></p>
        </div>
        <div id="back" class="face hidden">
          <small>RESPUESTA</small>
          <p id="answerText"></p>
          <textarea id="answerEditor" class="card-editor" maxlength="50000" aria-label="Respuesta de la tarjeta"></textarea>
          <p id="backHint"></p>
        </div>
        <div id="listening" class="face hidden">
          <small class="recording">● ESCUCHANDO</small>
          <p id="transcript">Escuchando…</p>
          <button id="stop">Detener</button>
        </div>
      </article>
    </section>
    <nav><button id="previous">‹</button><span>Deslizá para navegar</span><button id="next">›</button></nav>
  </main>
  <div id="toast" role="status" hidden>
    <span id="toastText"></span>
    <button id="undo" type="button" hidden>Deshacer</button>
  </div>
  <div id="consent" class="overlay" hidden>
    <div class="dialog"><p>El reconocimiento local no está disponible. Android puede usar el servicio configurado en el teléfono.</p><div><button id="deny">Cancelar</button><button id="allow">Continuar</button></div></div>
  </div>
  <script src="core.js"></script><script src="app.js"></script>
</body>
</html>
