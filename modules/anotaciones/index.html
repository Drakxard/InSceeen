<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
  <title>Anotaciones</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <button id="folderBack" class="icon-button back-button" type="button" aria-label="Elegir otra carpeta">←</button>
  <section id="foldersView" class="folders-view" hidden aria-label="Carpetas de Anotaciones">
    <button id="addFolder" class="add-folder" type="button" aria-label="Crear carpeta">+</button>
    <div class="folders-heading"><h1>Carpetas</h1><p id="emptyFolders">Toca + para crear la primera carpeta.</p></div>
    <div id="folderList" class="folder-list"></div>
  </section>
  <main id="deckView">
    <section id="stage">
      <article id="card" tabindex="0">
        <div id="fontControls" aria-label="Tamaño de tipografía">
          <button id="fontDecrease" type="button" aria-label="Reducir tipografía">−</button>
          <button id="fontIncrease" type="button" aria-label="Aumentar tipografía">+</button>
        </div>
        <div id="front" class="face"><small>CABECERA</small><h1 id="headerText"></h1><textarea id="headerEditor" class="card-editor" maxlength="50000" aria-label="Cabecera de la tarjeta"></textarea></div>
        <div id="back" class="face hidden"><small>RESPUESTA</small><p id="answerText"></p><textarea id="answerEditor" class="card-editor" maxlength="50000" aria-label="Respuesta de la tarjeta"></textarea></div>
        <div id="listening" class="face hidden"><small class="recording">● ESCUCHANDO</small><p id="transcript">Escuchando…</p><button id="stop">Detener</button></div>
        <div id="deleteIndicator" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false" aria-hidden="true"><path d="M8 4h8l1 2h4v2H3V6h4l1-2Zm-2 6h12l-1 10H7L6 10Zm3 2v6h2v-6H9Zm4 0v6h2v-6h-2Z"/></svg></div>
        <div id="recordIndicator" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false" aria-hidden="true"><path d="M12 15a4 4 0 0 0 4-4V6a4 4 0 1 0-8 0v5a4 4 0 0 0 4 4Zm7-4a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.92V21H8a1 1 0 1 0 0 2h8a1 1 0 1 0 0-2h-3v-3.08A7 7 0 0 0 19 11Z"/></svg></div>
      </article>
    </section>
    <section id="scrubber" aria-label="Navegación rápida entre tarjetas"></section>
  </main>
  <div id="toast" role="status" hidden><span id="toastText"></span><button id="undo" type="button" hidden>Deshacer</button></div>
  <div id="folderDialog" class="overlay" hidden><form id="folderForm" class="dialog"><h2>Nueva carpeta</h2><label for="folderName">Nombre</label><input id="folderName" maxlength="80" autocomplete="off"><p id="folderError" class="error" hidden></p><div><button id="cancelFolder" type="button">Cancelar</button><button type="submit" class="primary">Crear</button></div></form></div>
  <div id="deleteFolderDialog" class="overlay" hidden><div class="dialog"><h2>Eliminar carpeta</h2><p id="deleteFolderText"></p><div><button id="cancelDeleteFolder" type="button">Cancelar</button><button id="confirmDeleteFolder" class="danger" type="button">Eliminar</button></div></div></div>
  <div id="importDialog" class="overlay" hidden><div class="dialog import-dialog"><h2>Importar tarjetas</h2><p id="importSummary"></p><div id="importPreview" class="import-preview"></div><div><button id="cancelImport" type="button">Cancelar</button><button id="confirmImport" class="primary" type="button">Importar</button></div></div></div>
  <div id="consent" class="overlay" hidden><div class="dialog"><p>El reconocimiento local no está disponible. Android puede usar el servicio configurado en el teléfono.</p><div><button id="deny">Cancelar</button><button id="allow">Continuar</button></div></div></div>
  <script src="core.js"></script><script src="app.js"></script>
</body>
</html>
