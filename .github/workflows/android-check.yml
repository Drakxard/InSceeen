name: Android checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-library
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build debug APK
        working-directory: mobile_android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - uses: ./.github/actions/test-native-pdf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-validation
          path: |
            mobile_android/app/build/reports/
            mobile_android/app/build/outputs/apk/debug/*.apk
