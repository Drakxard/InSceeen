name: Android release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta existente que se debe compilar y publicar (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify release version
        shell: bash
        run: |
          version_name="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          test -n "$version_name"
          test "$RELEASE_TAG" = "v$version_name" || {
            echo "La etiqueta $RELEASE_TAG no coincide con versionName $version_name"
            exit 1
          }

      - name: Restore release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.INSCREEN_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.INSCREEN_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.INSCREEN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.INSCREEN_KEY_PASSWORD }}
        run: |
          mkdir -p .signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > .signing/inscreen-release.jks
          printf 'storeFile=.signing/inscreen-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > .signing/keystore.properties

      - name: Test and build signed APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk InScreenMic.apk
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" InScreenMic.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" InScreenMic.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "InScreen $RELEASE_TAG" \
              --generate-notes
          fi
