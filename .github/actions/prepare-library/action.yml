name: Prepare Cursado library readers
description: Build the original Cursado components as an offline web package from a pinned source revision.
runs:
  using: composite
  steps:
    - name: Read pinned source revision
      id: source
      shell: bash
      working-directory: ${{ github.workspace }}
      run: echo "ref=$(cat .github/cursado-reader-ref)" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@v4
      with:
        repository: Drakxard/cursado
        ref: ${{ steps.source.outputs.ref }}
        path: .cursado-reader
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: |
          .cursado-reader/package-lock.json
          .cursado-reader/pizarraproyecto-main/package-lock.json
    - name: Install reader dependencies
      shell: bash
      working-directory: ${{ github.workspace }}/.cursado-reader
      run: |
        npm ci --no-audit --no-fund
        npm --prefix pizarraproyecto-main ci --no-audit --no-fund
    - name: Check native dynamic loading
      shell: bash
      working-directory: ${{ github.workspace }}
      run: node --test tests/test_cursado_dynamic.mjs
    - name: Package offline readers
      shell: bash
      working-directory: ${{ github.workspace }}/.cursado-reader
      run: |
        cp ../scripts/cursado-native-dynamic.ts native-web/dynamic.ts
        node scripts/build-native-web.mjs ../modules/native-web
    - name: Check library publication and important tasks
      shell: bash
      working-directory: ${{ github.workspace }}/.cursado-reader
      run: node --test --experimental-strip-types tests/workspace-library.test.mts tests/workspace-library-publisher.test.mts
    - name: Install browser for shared reader checks
      shell: bash
      working-directory: ${{ github.workspace }}/.cursado-reader
      run: npx playwright install --with-deps chromium
    - name: Check shared mobile UI and offline PDF.js
      shell: bash
      working-directory: ${{ github.workspace }}/.cursado-reader
      env:
        INSCREEN_NATIVE_WEB_ASSETS: ../modules/native-web
      run: node --test tests/native-web.browser.mjs
